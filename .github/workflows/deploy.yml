name: Deploy Frontend

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    # =========================
    # 1. Build
    # =========================
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  VITE_API_BASE_URL: https://solvego-api.duckdns.org

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: dist/

    # =========================
    # 2. Deploy
    # =========================
    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist
                  path: dist/

            # =========================
            # Debug GitHub OIDC
            # =========================
            - name: Debug OIDC claims
              shell: bash
              run: |
                  TOKEN_RESPONSE=$(curl -sS \
                    -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

                  TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

                  PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
                  PAYLOAD="${PAYLOAD//-/+}"
                  PAYLOAD="${PAYLOAD//_/\/}"

                  case $((${#PAYLOAD} % 4)) in
                    2) PAYLOAD="${PAYLOAD}==" ;;
                    3) PAYLOAD="${PAYLOAD}=" ;;
                  esac

                  echo "$PAYLOAD" \
                    | base64 -d \
                    | jq '{iss, aud, sub, repository, ref}'

            # =========================
            # AWS Authentication
            # =========================
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::194130477116:role/solvego-frontend-deployer
                  aws-region: ap-northeast-2

            # =========================
            # S3 Deploy
            # =========================
            - name: Deploy to S3
              run: aws s3 sync dist/ s3://solvego-frontend --delete

            # =========================
            # CloudFront Cache Invalidation
            # =========================
            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ER0DIR3FZDZLD \
                    --paths "/*"
