name: Deploy Frontend

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    # =========================
    # 1. Test
    # =========================
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test:run

    # =========================
    # 2. Build
    # =========================
    build:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build
              env:
                  VITE_API_BASE_URL: https://solvego-api.duckdns.org

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: dist/

    # =========================
    # 3. Deploy
    # =========================
    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Download build artifact
              uses: actions/download-artifact@v4
              with:
                  name: frontend-dist
                  path: dist/

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: arn:aws:iam::194130477116:role/solvego-frontend-deployer
                  aws-region: ap-northeast-2

            - name: Deploy to S3
              run: aws s3 sync dist/ s3://solvego-frontend --delete

            - name: Invalidate CloudFront cache
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ER0DIR3FZDZLD \
                    --paths "/*"
